<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Case</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2118;--muted:#7a6a58;--paper:#f7efe4;--gold:#c4a15a;--dark:#1c1612;--moss:#3d5a45}
*{box-sizing:border-box}html,body{margin:0;background:var(--dark);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
.wrap{width:min(1180px,calc(100% - 24px));margin:16px auto 40px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#f3e6d4;margin-bottom:12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800}
.brand{display:flex;gap:10px;align-items:center}
.tabs button,.ghost,.start{border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:8px}
.tabs .on{background:var(--gold);color:var(--ink)}
.tabs .off,.ghost{background:#3a2f26;color:#f3e6d4}
.start{background:var(--gold);color:var(--ink);border-radius:14px;padding:12px 16px}
.hero,.panel{background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.cover-art{height:420px;display:grid;grid-template-columns:1.25fr .85fr}
.scene{position:relative;overflow:hidden;background:#2a2118}
.scene img{width:100%;height:420px;object-fit:cover;display:block}
.scene .tag{position:absolute;left:20px;bottom:18px;background:rgba(28,22,18,.72);padding:8px 12px;border-radius:10px;font-weight:800;letter-spacing:.08em;font-size:12px;color:#fff}
.copy{padding:28px 26px;background:#1c1612;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700;color:#e8d3a4}
h1{font-family:"Libre Caslon Display",Georgia,serif;font-size:clamp(36px,7vw,64px);margin:6px 0 8px;font-weight:400}
h2{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400}
.panel{padding:22px}.hidden{display:none}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:#eadcc8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.chip.prod{background:#8b3a2a;color:#fff}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:#fff;border-radius:16px;padding:14px;cursor:pointer;min-height:150px;box-shadow:0 6px 16px rgba(80,50,20,.08)}
.cell.done{outline:3px solid var(--gold)}
.shot{border-radius:16px;overflow:hidden;margin-bottom:10px;background:#2a2118;position:relative}
.shot img{width:100%;height:220px;object-fit:cover;display:block}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(20,14,10,.82));color:#fff;font-weight:700}
.choices,.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.choices button,.bank button{border:0;background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}
.choices .ok{background:var(--moss);color:#fff}
.feedback{min-height:22px;margin-top:8px;font-weight:700}
input,textarea{width:100%;border:1px solid #e0d0bc;border-radius:12px;padding:10px 12px;font:inherit;margin-top:8px}
textarea{min-height:90px}
.sort,.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:#fff;border-radius:16px;padding:12px;min-height:160px}
.tile{background:#eadcc8;border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:700}
.note{color:var(--muted)}
footer{display:flex;justify-content:space-between;color:#d9c8b2;margin-top:14px;font-size:13px}
.verbs span{background:#3a2f26;color:#f3e6d4;border-radius:999px;padding:4px 8px;font-size:12px;margin:4px}
@media(max-width:900px){.board,.cover-art,.pair,.sort{grid-template-columns:1fr}.scene img{height:220px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><div class="logo">PC</div><div><strong>PHOTO CASE</strong><div style="opacity:.75">Irregular Past</div></div></div>
<div class="tabs"><button id="backBoard" class="off">Board</button><button id="teacherBtn" class="off">Teacher</button><button id="verbsBtn" class="off">Verbs</button></div></div>
<section class="hero" id="cover"><div class="cover-art">
<div class="scene"><img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1400&q=80" alt="street"><div class="tag">YESTERDAY ON THE STREET</div></div>
<div class="copy"><div class="kicker">Grammar · Detective case</div><h1>Photo Case</h1>
<p>You are the detective. Open 3 case files.</p>
<p class="note" style="color:#d9c8b2">3 cells, at least 1 PRODUCTION.</p>
<p><button class="start" id="startBtn">Open the case board</button></p></div></div></section>
<section class="panel hidden" id="app"><div class="meta"><div class="chip" id="prog">Cells done: 0/3</div><div class="chip" id="prodChip">Need 1 PRODUCTION cell</div><div class="chip" id="picked">Chosen: —</div></div><div id="view"></div></section>
<footer><div>Past Simple irregulars</div><button class="ghost" id="resetBtn">Reset case</button></footer>
</div>
<script src="photos.js"></script>
</body></html>
