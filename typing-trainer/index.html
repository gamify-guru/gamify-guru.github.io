<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Typing Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; }
  .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
  .video-wrap {
    width: 100%;
    max-width: 520px;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1px solid #30363d;
  }
  video { width: 100%; display: block; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  #wordDisplay {
    font-size: 2.4rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    min-height: 60px;
    margin-bottom: 8px;
    color: #58a6ff;
  }
  #wordDisplay.hidden { visibility: hidden; }
  .hint { color: #8b949e; font-size: 0.85rem; margin-bottom: 20px; }
  #input {
    width: 100%;
    max-width: 320px;
    font-size: 1.6rem;
    padding: 12px 16px;
    border: 2px solid #30363d;
    border-radius: 8px;
    background: #0d1117;
    color: #e6edf3;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: #58a6ff; }
  #input.correct { border-color: #3fb950; }
  #input.wrong { border-color: #f85149; }
  button {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    margin: 6px 4px;
    transition: background 0.15s;
  }
  button:hover { background: #30363d; }
  button.primary { background: #238636; border-color: #2ea043; }
  button.primary:hover { background: #2ea043; }
  button.next { background: #1f6feb; border-color: #388bfd; display: none; }
  button.next:hover { background: #388bfd; }
  #keyboard {
    margin-top: 32px;
    width: 100%;
    max-width: 720px;
  }
  .row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
  .key {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 6px;
    min-width: 42px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #e6edf3;
    user-select: none;
    transition: background 0.08s, transform 0.08s;
  }
  .key.active { background: #58a6ff; color: #0d1117; }
  .key.wide { min-width: 80px; }
  .teacher-panel {
    margin-top: 28px;
    background: #161b22;
    border: 1px dashed #30363d;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    max-width: 520px;
    font-size: 0.85rem;
  }
  .teacher-panel h3 { margin-bottom: 10px; font-size: 0.95rem; }
  textarea {
    width: 100%;
    height: 100px;
    background: #0d1117;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
    resize: vertical;
  }
  .feedback { margin-top: 12px; font-size: 0.95rem; min-height: 1.4em; }
  .feedback.good { color: #3fb950; }
  .feedback.bad { color: #f85149; }
  .results {
    margin-top: 18px;
    padding: 16px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    display: none;
  }
  .results h3 { margin-bottom: 10px; font-size: 1.05rem; }
  .results p { margin: 6px 0; font-size: 1rem; }
  .results .good { color: #3fb950; font-weight: 600; }
  .results .bad { color: #f85149; font-weight: 600; }
</style>
</head>
<body>
  <h1>Word Typing</h1>
  <p class="subtitle">Слушай видео и напечатай слова</p>

  <div class="video-wrap">
    <video id="introVideo" controls preload="metadata">
      <source src="words-video.mp4" type="video/mp4">
    </video>
  </div>

  <div class="card">
    <div id="wordDisplay" class="hidden">—</div>
    <p class="hint" id="hint">Печатай слова из видео</p>
    <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="печатай здесь" autofocus>
    <div class="feedback" id="feedback"></div>
    <div style="margin-top:14px">
      <button id="nextBtn" class="next">Следующее слово →</button>
      <button id="skip">Пропустить</button>
      <button id="checkBtn" class="primary">Проверить</button>
    </div>
    <div class="results" id="results">
      <h3>Результат</h3>
      <p>Правильно: <span class="good" id="resCorrect">0</span></p>
      <p>Неправильно: <span class="bad" id="resWrong">0</span></p>
      <p>Всего попыток: <span id="resTotal">0</span></p>
      <div style="margin-top:12px">
        <button id="continueBtn">Продолжить</button>
        <button id="resetBtn">Начать снова</button>
      </div>
    </div>
  </div>

  <div id="keyboard"></div>

  <div class="teacher-panel" id="teacherPanel" style="display:none">
    <h3>Режим учителя</h3>
    <p style="margin-bottom:8px; color:#8b949e">Слова (по одному на строку).</p>
    <textarea id="wordList"></textarea>
    <div style="margin-top:8px">
      <button id="saveWords" class="primary">Сохранить слова</button>
      <button id="hideTeacher">Скрыть панель</button>
    </div>
  </div>

<script>
const DEFAULT_WORDS = [
  "clean",
  "dust",
  "make the bed",
  "sweep the floor",
  "tidy up",
  "wash up",
  "play chess",
  "play computer games",
  "read a comic",
  "watch a film"
];

let words = DEFAULT_WORDS.slice();
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let currentWord = "";
let answered = false;
const isTeacher = new URLSearchParams(location.search).has("teacher");

const input = document.getElementById("input");
const wordDisplay = document.getElementById("wordDisplay");
const feedback = document.getElementById("feedback");
const hint = document.getElementById("hint");
const teacherPanel = document.getElementById("teacherPanel");
const wordList = document.getElementById("wordList");
const results = document.getElementById("results");
const resCorrect = document.getElementById("resCorrect");
const resWrong = document.getElementById("resWrong");
const resTotal = document.getElementById("resTotal");
const nextBtn = document.getElementById("nextBtn");

if (isTeacher) {
  teacherPanel.style.display = "block";
  wordList.value = words.join("\n");
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextWord() {
  answered = false;
  nextBtn.style.display = "none";
  if (words.length === 0) {
    hint.textContent = "Нет слов.";
    currentWord = "";
    return;
  }
  if (currentIndex >= words.length) {
    currentIndex = 0;
    shuffle(words);
  }
  currentWord = words[currentIndex];
  currentIndex++;
  input.value = "";
  input.className = "";
  input.disabled = false;
  feedback.textContent = "";
  feedback.className = "feedback";
  if (isTeacher) {
    wordDisplay.textContent = currentWord;
    wordDisplay.classList.remove("hidden");
    hint.textContent = "Режим учителя: слово видно";
  } else {
    wordDisplay.classList.add("hidden");
    hint.textContent = "Печатай слово из видео";
  }
  input.focus();
}

function normalize(str) {
  return str.trim().toLowerCase().replace(/\s+/g, " ");
}

function check() {
  if (answered) {
    nextWord();
    return;
  }
  const typed = normalize(input.value);
  if (!currentWord || !typed) return;

  const isCorrect = typed === normalize(currentWord);
  answered = true;
  input.disabled = true;
  nextBtn.style.display = "inline-block";

  if (isCorrect) {
    correctCount++;
    input.className = "correct";
    feedback.textContent = "Верно!";
    feedback.className = "feedback good";
  } else {
    wrongCount++;
    input.className = "wrong";
    feedback.textContent = "Неверно. Правильно: " + currentWord;
    feedback.className = "feedback bad";
    wordDisplay.textContent = currentWord;
    wordDisplay.classList.remove("hidden");
  }
}

function showResults() {
  resCorrect.textContent = correctCount;
  resWrong.textContent = wrongCount;
  resTotal.textContent = correctCount + wrongCount;
  results.style.display = "block";
  input.disabled = true;
}

function hideResults() {
  results.style.display = "none";
  input.disabled = false;
  input.focus();
}

function resetAll() {
  correctCount = 0;
  wrongCount = 0;
  currentIndex = 0;
  hideResults();
  shuffle(words);
  nextWord();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    check();
  }
});

nextBtn.addEventListener("click", nextWord);

document.getElementById("skip").addEventListener("click", nextWord);

document.getElementById("checkBtn").addEventListener("click", showResults);

document.getElementById("continueBtn").addEventListener("click", hideResults);

document.getElementById("resetBtn").addEventListener("click", resetAll);

document.getElementById("saveWords").addEventListener("click", () => {
  const lines = wordList.value.split("\n").map(s => s.trim()).filter(Boolean);
  if (lines.length) {
    words = lines;
    resetAll();
    alert("Слова сохранены.");
  }
});

document.getElementById("hideTeacher").addEventListener("click", () => {
  teacherPanel.style.display = "none";
});

// Клавиатура
const rows = [
  "q w e r t y u i o p".split(" "),
  "a s d f g h j k l".split(" "),
  ["⇧", ..."z x c v b n m".split(" "), "⌫"]
];

const kb = document.getElementById("keyboard");
rows.forEach(row => {
  const div = document.createElement("div");
  div.className = "row";
  row.forEach(k => {
    const el = document.createElement("div");
    el.className = "key" + (k === "⇧" || k === "⌫" ? " wide" : "");
    el.textContent = k;
    el.dataset.key = k.toLowerCase();
    div.appendChild(el);
  });
  kb.appendChild(div);
});

function highlightKey(key) {
  const k = key.toLowerCase();
  document.querySelectorAll(".key").forEach(el => {
    if (el.dataset.key === k) {
      el.classList.add("active");
      setTimeout(() => el.classList.remove("active"), 100);
    }
  });
}

input.addEventListener("input", () => {
  const last = input.value.slice(-1);
  if (last && last !== " ") highlightKey(last);
});

// Старт
shuffle(words);
nextWord();
</script>
</body>
</html>
