<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Missing Notebook</title>
<style>
  :root {
    --ink: #1c2230;
    --muted: #5c6170;
    --navy: #1b2440;
    --purple: #6b4bb5;
    --teal: #1f6f86;
    --gold: #c9842a;
    --cream: #f7f3ec;
    --card: #fffdf9;
    --line: #e4ddd2;
    --ok: #1f7a4d;
    --bad: #9a4a32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 500px at 10% -10%, #efe6ff, transparent), var(--cream);
  }
  header {
    background: var(--navy);
    color: white;
    padding: 18px 22px 16px;
  }
  .brand {
    display: inline-block;
    background: #b9a6ef;
    color: var(--navy);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .04em;
    border-radius: 8px;
    padding: 4px 8px;
    margin-bottom: 8px;
  }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  header p { margin: 6px 0 0; color: #d5d8e6; font-size: 14px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  .pages { display: flex; gap: 8px; margin: 4px 0 16px; flex-wrap: wrap; }
  .page-dot {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: white; border: 1px solid var(--line);
    font-weight: 700; color: var(--muted);
  }
  .page-dot.on { background: var(--navy); color: white; border-color: var(--navy); }
  .page-dot.done { background: #e7f6ee; color: var(--ok); border-color: #b7e0c8; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(27, 36, 64, .05);
  }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--purple); }
  h2 { margin: 4px 0 8px; font-size: 22px; }
  .lead { color: var(--muted); margin: 0 0 14px; }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  input[type="text"], select, textarea {
    width: 100%;
    border: 1px solid #d9d1c6;
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    background: white;
  }
  textarea { min-height: 72px; resize: vertical; }
  .row { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; margin: 8px 0; }
  .num {
    width: 28px; height: 28px; border-radius: 50%;
    background: #efe8ff; color: var(--purple);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .q { font-size: 15px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .scene {
    width: 100%; border-radius: 14px; display: block; margin: 8px 0 14px;
    border: 1px solid var(--line);
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button {
    border: 0; border-radius: 12px; padding: 11px 16px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  button.primary { background: var(--navy); color: white; }
  button.ghost { background: #efe8ff; color: var(--navy); }
  button:disabled { opacity: .45; cursor: default; }
  .feedback { margin-top: 12px; font-size: 14px; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .choices { display: grid; gap: 8px; }
  .choice {
    text-align: left; background: white; border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; font-weight: 600;
  }
  .choice.pick { border-color: var(--gold); background: #fff6ea; }
  .pair { display: grid; grid-template-columns: 1fr 180px; gap: 8px; align-items: center; }
  .verb { display: flex; gap: 8px; flex-wrap: wrap; }
  .verb button { background: white; border: 1px solid var(--line); font-weight: 600; }
  .verb button.pick { border-color: var(--purple); background: #f3eeff; }
  .grid2 { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .score-hero { font-size: 42px; font-weight: 800; margin: 0; }
  .rank { font-size: 18px; font-weight: 700; color: var(--teal); }
  .miss { background: #fff4ef; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  @media (max-width: 760px) {
    .grid2, .pair { grid-template-columns: 1fr; }
    header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">AT SCHOOL</div>
  <h1>The Missing Notebook</h1>
  <p>Someone lost a notebook. Look closely, find the clues and close the case.</p>
</header>
<div class="wrap">
  <div class="pages" id="pages"></div>
  <div id="app"></div>
  <footer>Look closer. Think harder. You can do it. · @gamify_guru</footer>
</div>
<script>
const IMG = "scene.jpg";
const subjects = ["art","break time","computer studies","English","homework","maths","music","PE","science","social studies"];
const state = {
  step: 0,
  name: "",
  locked: {},
  scores: {},
  answers: {},
  suspect: ""
};

const clues = [
  { q: "It's a notebook with drawings in it. It's not for homework.", ok: ["sketchbook","art book","drawing book","notebook"] },
  { q: "You can play this sport with a ball.", ok: ["basketball","ball","pe"] },
  { q: "You use this to listen to music.", ok: ["headphones","headset"] },
  { q: "It's a place where you can relax and rest.", ok: ["bench","seat"] },
  { q: "You can read books in this class.", ok: ["english","book","books"] },
  { q: "It's a subject about the Earth, countries and people.", ok: ["social studies","map","geography"] },
  { q: "It's a blue and white bag. You take it to school.", ok: ["school bag","bag","backpack","rucksack"] },
  { q: "You can use this to write and type.", ok: ["laptop","computer","pen","pencil"] }
];
const matchKey = ["art","PE","music","break time","English","social studies","homework","computer studies"];
const timeKey = ["English","social studies","break time","maths","lunch","art","science","PE"];
const times = ["9:00","10:00","10:30","11:00","12:00","1:00","2:00","3:00"];
const grammar = [
  { text: "The boy in the purple hoodie ___ a backpack.", time: "now", verb: "is carrying", options: ["carries","is carrying"] },
  { text: "Students ___ PE with a ball on Mondays.", time: "always", verb: "have", options: ["have","are having"] },
  { text: "The girl on the bench ___ a book.", time: "now", verb: "is reading", options: ["reads","is reading"] },
  { text: "We ___ homework at home, not in the hallway.", time: "always", verb: "do", options: ["do","are doing"] },
  { text: "The boy with the ball ___ basketball.", time: "now", verb: "is playing", options: ["plays","is playing"] },
  { text: "The girl with the pink bag ___ music.", time: "always", verb: "likes", options: ["likes","is liking"] }
];

function norm(s){ return (s||"").trim().toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," "); }
function has(s, words){ const n = norm(s); return words.some(w => n.includes(w)); }
function el(html){ app.innerHTML = html; bind(); drawPages(); }

function drawPages(){
  const labels = ["1","2","3","4","5","6","★"];
  pages.innerHTML = labels.map((label,i) => {
    const cls = i === state.step ? "on" : (state.locked[i] ? "done" : "");
    return `<div class="page-dot ${cls}">${label}</div>`;
  }).join("");
}

function start(){
  el(`
    <section class="card">
      <div class="tag">Case file</div>
      <h2>Open the notebook</h2>
      <p class="lead">You are the detective. Six pages are missing. Find them, then close the case.</p>
      <img class="scene" src="${IMG}" alt="School hallway" />
      <label>Your name</label>
      <input id="name" type="text" placeholder="Alex" />
      <div class="actions"><button class="primary" id="go">Open page 1</button></div>
    </section>`);
}
function task1(){
  const rows = clues.map((c,i) => `
    <div class="row"><div class="num">${i+1}</div>
      <div><div class="q">${c.q}</div>
      <input data-i="${i}" value="${state.answers.t1?.[i]||""}" placeholder="Write the word" /></div></div>`).join("");
  el(`<section class="card"><div class="tag">Page 1 · Treasure hunt</div><h2>Find the clues</h2>
    <p class="lead">Look at the picture. Read the clue. Write the word.</p>
    <img class="scene" src="${IMG}" alt="School hallway" />${rows}
    <div class="actions"><button class="primary" id="check">Check this page</button></div>
    <div class="feedback" id="fb"></div></section>`);
}
function task2(){
  const opts = subjects.map(s => `<option>${s}</option>`).join("");
  const rows = clues.map((c,i) => `
    <div class="row"><div class="num">${i+1}</div>
      <div class="pair"><div class="q">${c.q}</div>
      <select data-i="${i}"><option value="">Choose</option>${opts}</select></div></div>`).join("");
  el(`<section class="card"><div class="tag">Page 2 · Match</div><h2>Name the evidence</h2>
    <p class="lead">Match each clue with a school word. The order is mixed.</p>${rows}
    <div class="actions"><button class="ghost" id="pic">Show the picture</button><button class="primary" id="check">Check this page</button></div>
    <div id="picbox"></div><div class="feedback" id="fb"></div></section>`);
}
function task3(){
  const a = state.answers.t3 || ["","","","",""];
  el(`<section class="card"><div class="tag">Page 3 · Mystery</div><h2>Solve the mini-case</h2>
    <p class="lead">Answer in short English. Look at the picture again if you need to.</p>
    <img class="scene" src="${IMG}" alt="School hallway" />
    <label>1. What subject is on the poster?</label><input id="a0" value="${a[0]}" />
    <label>2. What time is it? Use a time expression.</label><input id="a1" value="${a[1]}" placeholder="It's break time." />
    <label>3. Why is the notebook important?</label><input id="a2" value="${a[2]}" />
    <label>4. Who might have taken it?</label><input id="a3" value="${a[3]}" />
    <label>5. What do you think happened? 2–3 sentences.</label><textarea id="a4">${a[4]}</textarea>
    <div class="actions"><button class="primary" id="check">Check this page</button></div>
    <div class="feedback" id="fb"></div></section>`);
}
function task4(){
  const opts = ["English","social studies","break time","maths","lunch","art","science","PE","music","computer studies","homework"]
    .map(s => `<option>${s}</option>`).join("");
  const rows = times.map((t,i) => `<tr><td><b>${t}</b></td><td><select data-i="${i}"><option value="">—</option>${opts}</select></td></tr>`).join("");
  el(`<section class="card"><div class="tag">Page 4 · Mystery</div><h2>Read the torn page</h2>
    <p class="lead">A Monday page is torn. Use first, after and before. Homework is not on the grid.</p>
    <div class="grid2"><div>
      <div class="q">1 English is first. It starts at 9:00.</div>
      <div class="q">2 After English we've got social studies.</div>
      <div class="q">3 Break time is at 10:30.</div>
      <div class="q">4 Maths is before lunch. Lunch is at 12:00.</div>
      <div class="q">5 Art is after lunch, at 1:00.</div>
      <div class="q">6 Science is at 2:00. PE is last, at 3:00.</div>
      <div class="q">7 Homework: computer studies and music.</div>
    </div><table>${rows}</table></div>
    <div class="actions"><button class="primary" id="check">Check this page</button></div>
    <div class="feedback" id="fb"></div></section>`);
}
function task5(){
  const blocks = grammar.map((g,i) => `
    <div class="row"><div class="num">${i+1}</div><div>
      <div class="q">${g.text}</div>
      <div class="verb" data-kind="time" data-i="${i}">
        <button type="button" data-v="now">now</button>
        <button type="button" data-v="always">always</button>
      </div>
      <div class="verb" data-kind="verb" data-i="${i}">
        ${g.options.map(o => `<button type="button" data-v="${o}">${o}</button>`).join("")}
      </div>
    </div></div>`).join("");
  el(`<section class="card"><div class="tag">Page 5 · Boss battle</div><h2>Now or always</h2>
    <p class="lead">Look at the hallway. Now = what you can see. Always = every school day.</p>
    <img class="scene" src="${IMG}" alt="School hallway" />${blocks}
    <div class="actions"><button class="primary" id="check">Check this page</button></div>
    <div class="feedback" id="fb"></div></section>`);
}
function task6(){
  el(`<section class="card"><div class="tag">Page 6 · Final boss</div><h2>Close the case</h2>
    <p class="lead">Choose one suspect. Then write the report.</p>
    <div class="choices">
      <button class="choice" data-s="A">A · Girl in the green jacket. She is good at art. The notebook has drawings.</button>
      <button class="choice" data-s="B">B · Boy with the ball. He is not good at art. He likes PE and break time.</button>
      <button class="choice" data-s="C">C · Girl on the bench. She is good at English. Now she is reading.</button>
    </div>
    <label>I think ___ took the notebook.</label><input id="r1" placeholder="the girl in the green jacket" />
    <label>It is important because ___.</label><input id="r2" />
    <label>He / She is good at ___.</label><input id="r3" />
    <label>He / She is not good at ___.</label><input id="r4" />
    <label>Now he / she is ___.</label><input id="r5" />
    <div class="actions"><button class="primary" id="check">Close the case</button></div>
    <div class="feedback" id="fb"></div></section>`);
}

function finish(){
  const max = 8+8+5+8+12+6;
  const got = Object.values(state.scores).reduce((a,b)=>a+b,0);
  const rank = got >= 40 ? "Case closed" : got >= 28 ? "Strong lead" : "Look closer";
  const report = state.answers.report || {};
  const who = {A:"the girl in the green jacket", B:"the boy with the ball", C:"the girl on the bench"}[state.suspect] || "—";
  el(`<section class="card">
    <div class="tag">Case file · result</div>
    <p class="score-hero">${got} / ${max}</p>
    <p class="rank">${rank}</p>
    <p class="lead">Detective ${state.name || "—"} closed The Missing Notebook.</p>
    <p><b>Suspect:</b> ${state.suspect || "—"} · ${who}</p>
    <p><b>Report:</b> I think ${report.r1||"—"} took the notebook. It is important because ${report.r2||"—"}. He / She is good at ${report.r3||"—"}. He / She is not good at ${report.r4||"—"}. Now he / she is ${report.r5||"—"}.</p>
    <h2>Pages</h2>
    <p>1 Find the clues — ${state.scores[1]||0}/8</p>
    <p>2 Name the evidence — ${state.scores[2]||0}/8</p>
    <p>3 Mini-case — ${state.scores[3]||0}/5</p>
    <p>4 Torn timetable — ${state.scores[4]||0}/8</p>
    <p>5 Now or always — ${state.scores[5]||0}/12</p>
    <p>6 Close the case — ${state.scores[6]||0}/6</p>
    <p class="hint">Screenshot this page for the teacher.</p>
    <div class="actions"><button class="ghost" id="again">Open the case again</button></div>
  </section>`);
}

function markInputs(bad){
  document.querySelectorAll("[data-i]").forEach(node => {
    if (node.matches("input, select") && bad.includes(Number(node.dataset.i))) node.classList.add("miss");
  });
}

function bind(){
  document.getElementById("go")?.addEventListener("click", () => {
    state.name = document.getElementById("name").value.trim();
    state.step = 1; task1();
  });
  document.getElementById("again")?.addEventListener("click", () => location.reload());
  document.getElementById("pic")?.addEventListener("click", () => {
    picbox.innerHTML = `<img class="scene" src="${IMG}" alt="School hallway" />`;
  });
  document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
    state.suspect = btn.dataset.s;
    document.querySelectorAll(".choice").forEach(b => b.classList.remove("pick"));
    btn.classList.add("pick");
  }));
  document.querySelectorAll(".verb button").forEach(btn => btn.addEventListener("click", () => {
    const box = btn.parentElement;
    box.querySelectorAll("button").forEach(b => b.classList.remove("pick"));
    btn.classList.add("pick");
  }));
  document.getElementById("check")?.addEventListener("click", check);
}

function check(){
  if (state.step === 1) {
    const vals = [...document.querySelectorAll("input[data-i]")].map(n => n.value);
    state.answers.t1 = vals;
    const bad = [];
    let score = 0;
    vals.forEach((v,i) => { if (clues[i].ok.includes(norm(v))) score++; else bad.push(i); });
    state.scores[1] = score;
    fb.innerHTML = bad.length ? `<span class="bad">Look again at ${bad.map(n=>n+1).join(", ")}. The picture still has the clue.</span>` : `<span class="ok">Page 1 is open. ${score}/8</span>`;
    markInputs(bad);
    next(2, task2);
    return;
  }
  if (state.step === 2) {
    const vals = [...document.querySelectorAll("select[data-i]")].map(n => n.value);
    state.answers.t2 = vals;
    const bad = [];
    let score = 0;
    vals.forEach((v,i) => { if (norm(v) === norm(matchKey[i])) score++; else bad.push(i); });
    state.scores[2] = score;
    fb.innerHTML = bad.length ? `<span class="bad">Not yet: ${bad.map(n=>n+1).join(", ")}. Match the object, not a new story.</span>` : `<span class="ok">Evidence named. ${score}/8</span>`;
    next(3, task3);
    return;
  }
  if (state.step === 3) {
    const a = [0,1,2,3,4].map(i => document.getElementById("a"+i).value);
    state.answers.t3 = a;
    let score = 0;
    const notes = [];
    if (has(a[0], ["music","festival"])) score++; else notes.push("The poster says School Festival, with music notes.");
    if (has(a[1], ["break","o'clock","oclock","am","pm"]) || /\d/.test(a[1])) score++; else notes.push("Use a time expression: It's break time.");
    if (has(a[2], ["draw","art","picture","homework"])) score++; else notes.push("The notebook has drawings. It is not for homework.");
    if (norm(a[3]).split(" ").length >= 2) score++; else notes.push("Name a person from the picture.");
    if (norm(a[4]).split(" ").length >= 8) score++; else notes.push("Tell the story in 2–3 sentences.");
    state.scores[3] = score;
    fb.innerHTML = notes.length ? `<span class="bad">${notes[0]}</span>` : `<span class="ok">Mini-case solved. ${score}/5</span>`;
    next(4, task4);
    return;
  }
  if (state.step === 4) {
    const vals = [...document.querySelectorAll("select[data-i]")].map(n => n.value);
    state.answers.t4 = vals;
    const bad = [];
    let score = 0;
    vals.forEach((v,i) => { if (norm(v) === norm(timeKey[i])) score++; else bad.push(i); });
    state.scores[4] = score;
    fb.innerHTML = bad.length ? `<span class="bad">Check ${bad.map(n=>times[n]).join(", ")}. Read first / after / before again.</span>` : `<span class="ok">Monday is back. ${score}/8</span>`;
    next(5, task5);
    return;
  }
  if (state.step === 5) {
    let score = 0;
    const bad = [];
    const picked = [];
    grammar.forEach((g,i) => {
      const time = document.querySelector(`.verb[data-kind="time"][data-i="${i}"] .pick`)?.dataset.v;
      const verb = document.querySelector(`.verb[data-kind="verb"][data-i="${i}"] .pick`)?.dataset.v;
      picked.push({time, verb});
      if (time === g.time) score++; else bad.push(i+1);
      if (verb === g.verb) score++; else if (!bad.includes(i+1)) bad.push(i+1);
    });
    state.answers.t5 = picked;
    state.scores[5] = score;
    fb.innerHTML = score < 12 ? `<span class="bad">Look again at ${[...new Set(bad)].join(", ")}. Now is in the picture. Always is every Monday.</span>` : `<span class="ok">Verb lock open. 12/12</span>`;
    next(6, task6);
    return;
  }
  if (state.step === 6) {
    const report = {r1: r1.value, r2: r2.value, r3: r3.value, r4: r4.value, r5: r5.value};
    state.answers.report = report;
    let score = state.suspect ? 1 : 0;
    const notes = [];
    if (!state.suspect) notes.push("Choose A, B or C.");
    ["r1","r2","r3","r4","r5"].forEach(k => { if (norm(report[k]).length > 1) score++; else notes.push("Finish every line of the report."); });
    if (score > 6) score = 6;
    state.scores[6] = score;
    if (notes.length) { fb.innerHTML = `<span class="bad">${notes[0]}</span>`; return; }
    state.locked[6] = true;
    state.step = 7;
    finish();
  }
}
function next(step, view){
  if (document.getElementById("nextgo")) return;
  state.locked[state.step] = true;
  const go = document.createElement("button");
  go.id = "nextgo";
  go.className = "primary";
  go.textContent = step === 6 ? "Open the last page" : "Next page";
  go.onclick = () => { state.step = step; view(); };
  document.querySelector(".actions").appendChild(go);
}

start();
</script>
</body>
</html>
